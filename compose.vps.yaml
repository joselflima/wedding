name: wedding
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wedding_producao
      MYSQL_USER: ${MYSQL_USER:?Required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build:
      context: https://github.com/joselflima/wedding.git#${APP_REF:?Required}
    image: wedding-base:${APP_REF:?Required}
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Required}
      MYSQL_HOST: db
      DJANGO_DEBUG: "false"
      DJANGO_HTTPS: "true"
      DJANGO_ALLOWED_HOSTS: dudaejose.com.br,www.dudaejose.com.br,wedding.srv1625057.hstgr.cloud,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://dudaejose.com.br,https://www.dudaejose.com.br,https://wedding.srv1625057.hstgr.cloud
      MYSQL_DATABASE: wedding_producao
      MYSQL_USER: ${MYSQL_USER:?Required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Required}
    depends_on:
      db:
        condition: service_healthy
    networks: [default, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: shared_net
      traefik.http.routers.wedding.rule: 'Host(`dudaejose.com.br`) || Host(`www.dudaejose.com.br`) || Host(`wedding.srv1625057.hstgr.cloud`)'
      traefik.http.routers.wedding.entrypoints: websecure
      traefik.http.routers.wedding.tls.certresolver: letsencrypt
      traefik.http.services.wedding.loadbalancer.server.port: "8000"
volumes:
  mysql_data:
    name: wedding_producao_mysql_data

networks:
  traefik:
    external: true
    name: shared_net
