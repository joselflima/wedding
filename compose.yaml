name: wedding
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Required}
      MYSQL_USER: ${MYSQL_USER:?Required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build: .
    image: wedding-base:local
    restart: unless-stopped
    env_file: .env.local
    environment:
      MYSQL_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:8000:8000
volumes:
  mysql_data:
    name: wedding_local_mysql_data
